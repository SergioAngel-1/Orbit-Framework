# ============================================================================
#  HWE Orbit — Docker Compose (desarrollo)
#  Servicios:
#    - db        : MariaDB 11.8 LTS (persistencia en volumen nombrado)
#    - wordpress : WordPress 7.1 (PHP 8.4 + Apache) como Headless CMS -> :8080
#    - wpcli     : WP-CLI para automatizar la instalación/configuración
#    - redis     : Cache / rate-limit / idempotencia (BFF del frontend)
#    - frontend  : Next.js (App Router) en modo desarrollo            -> :3000
#
#  Para producción usa docker-compose.prod.yml
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Base de datos
  # --------------------------------------------------------------------------
  db:
    image: mariadb:11.8
    container_name: hwe_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: "${MYSQL_DATABASE:-wordpress}"
      MARIADB_USER: "${MYSQL_USER:-wordpress}"
      MARIADB_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hwe_net

  # --------------------------------------------------------------------------
  # WordPress (Headless CMS)
  # --------------------------------------------------------------------------
  wordpress:
    image: wordpress:7.1-php8.4-apache
    container_name: hwe_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress}"
      WORDPRESS_DEBUG: "${WORDPRESS_DEBUG:-1}"
      # Inyecta PHP directamente en wp-config.php (clave JWT, entorno, etc.)
      WORDPRESS_CONFIG_EXTRA: |
        define( 'GRAPHQL_JWT_AUTH_SECRET_KEY', '${GRAPHQL_JWT_AUTH_SECRET_KEY:-changeme-super-secret-jwt-key}' );
        define( 'WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-local}' );
        define( 'HEADLESS_FRONTEND_URL', '${HEADLESS_FRONTEND_URL:-http://localhost:3000}' );
        define( 'HEADLESS_ALLOWED_ORIGINS', '${HEADLESS_ALLOWED_ORIGINS:-http://localhost:3000}' );
        define( 'HWE_REVALIDATION_SECRET', '${HWE_REVALIDATION_SECRET:-changeme-hwe-revalidation-secret}' );
        define( 'HWE_BACKUPS_DIR', '/var/www/hwe-backups' );
        define( 'WP_REDIS_HOST', 'redis' );
        define( 'WP_REDIS_PORT', 6379 );
        // Prefijo + flush SELECTIVO: Redis es COMPARTIDO con el frontend (ISR,
        // tokens revocados, rate-limit, idempotencia, 2FA). Sin esto, «Flush cache»
        // de Redis Object Cache y `wp cache flush` hacen FLUSHDB y se llevan por
        // delante todo eso — incluidas las listas de revocación (un token revocado
        // volvería a valer). Con él solo borran las claves `hwe-wp:*`.
        define( 'WP_REDIS_PREFIX', 'hwe-wp:' );
        define( 'WP_REDIS_SELECTIVE_FLUSH', true );
        define( 'WP_CACHE', true );
        define( 'HWE_TRUSTED_PROXY_COUNT', ${TRUSTED_PROXY_COUNT:-1} );
        // Login del panel en /<slug> en vez de /wp-login.php (hwe-login-slug.php). Vacío = sin mover.
        define( 'HWE_LOGIN_SLUG', '${HWE_LOGIN_SLUG:-}' );
        // IPs que pueden llegar a GraphQL como integración externa (módulo
        // `external-integration`). Vacío = nadie. Ver docs/SECURITY.md.
        define( 'HWE_INTEGRATION_ALLOWED_IPS', '${HWE_INTEGRATION_ALLOWED_IPS:-}' );
        if ( ! defined( 'WP_DEBUG_LOG' ) ) { define( 'WP_DEBUG_LOG', true ); }
        // El siteurl (host:puerto publicado, p. ej. localhost:8080) no es alcanzable
        // en loopback DESDE DENTRO del contenedor (Apache solo escucha :80 aquí): el
        // spawn HTTP de WP-Cron y el dispatch asíncrono de Action Scheduler fallan
        // con «connection refused» y las acciones se represan. El servicio `wp-cron`
        // ejecuta los eventos en proceso por WP-CLI (sin loopback), así que el
        // pseudo-cron por petición queda desactivado.
        define( 'DISABLE_WP_CRON', true );
    healthcheck:
      # Endpoint ligero (categorías con 1 post) en lugar de /wp-json/ que devuelve >1MB con WooCommerce
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost/wp-json/wp/v2/categories?per_page=1 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 6
    volumes:
      - wordpress_core:/var/www/html
      # Volumen para wp-content completo (plugins, themes, uploads) — empieza limpio
      # en cada deploy, sin arrastrar basura del host.
      - wordpress_content:/var/www/html/wp-content
      # mu-plugins y el tema base son código versionado del framework: se
      # montan desde el host (SOBREESCRIBEN esos subdirectorios dentro del
      # volumen wordpress_content, que se inicializa con el contenido default
      # de la imagen de WordPress — plugins de terceros sí quedan en el
      # volumen, instalados por setup.sh vía WP-CLI).
      - ./backend/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./backend/wp-content/themes/hwe-headless-base:/var/www/html/wp-content/themes/hwe-headless-base
      # Plugins PROPIOS (módulos del framework): código versionado, montado desde el
      # host como el tema. Los de terceros los instala setup.sh en el volumen.
      - ./backend/wp-content/plugins/hwe-banners:/var/www/html/wp-content/plugins/hwe-banners
      - ./backend/wp-content/plugins/hwe-site-reviews:/var/www/html/wp-content/plugins/hwe-site-reviews
      - ./backend/wp-content/plugins/hwe-coupon-rules:/var/www/html/wp-content/plugins/hwe-coupon-rules
      - ./backend/wp-content/plugins/hwe-consent-log:/var/www/html/wp-content/plugins/hwe-consent-log
      - ./backend/wp-content/plugins/hwe-shipping:/var/www/html/wp-content/plugins/hwe-shipping
      - ./backend/wp-content/plugins/hwe-product-landing:/var/www/html/wp-content/plugins/hwe-product-landing
      - ./backend/wp-content/plugins/hwe-landings:/var/www/html/wp-content/plugins/hwe-landings
      - ./backend/wp-content/plugins/hwe-customer-identity:/var/www/html/wp-content/plugins/hwe-customer-identity
      - ./backend/wp-content/plugins/hwe-external-integration:/var/www/html/wp-content/plugins/hwe-external-integration
      - ./backend/wp-content/plugins/hwe-loyalty:/var/www/html/wp-content/plugins/hwe-loyalty
      - ./backend/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      # Bridge de backups (ver HWE_BACKUPS_DIR arriba): fuera del docroot para
      # que nunca sea servible por HTTP. Mismo host path que el servicio
      # `backup` (montado ahí en /backups).
      - ./backups:/var/www/hwe-backups
    networks:
      - hwe_net

  # --------------------------------------------------------------------------
  # WP-CLI (automatización: instala WP + plugins + configuración headless)
  # --------------------------------------------------------------------------
  wpcli:
    image: wordpress:cli-php8.4
    container_name: hwe_wpcli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33" # www-data, mismo UID que el contenedor de WordPress
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress}"
      WP_URL: "${WORDPRESS_PUBLIC_URL:-http://localhost:8080}"
      WP_TITLE: "${WP_TITLE:-HWE-Orbit}"
      WP_ADMIN_USER: "${WP_ADMIN_USER:-admin}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD:-admin}"
      WP_ADMIN_EMAIL: "${WP_ADMIN_EMAIL:-admin@example.com}"
      HEADLESS_FRONTEND_URL: "${HEADLESS_FRONTEND_URL:-http://frontend:3000}"
      WC_WEBHOOK_SECRET: "${WC_WEBHOOK_SECRET:-}"
    volumes:
      - wordpress_core:/var/www/html
      - wordpress_content:/var/www/html/wp-content
      - ./backend/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./backend/wp-content/themes/hwe-headless-base:/var/www/html/wp-content/themes/hwe-headless-base
      # Plugins PROPIOS (módulos del framework): código versionado, montado desde el
      # host como el tema. Los de terceros los instala setup.sh en el volumen.
      - ./backend/wp-content/plugins/hwe-banners:/var/www/html/wp-content/plugins/hwe-banners
      - ./backend/wp-content/plugins/hwe-site-reviews:/var/www/html/wp-content/plugins/hwe-site-reviews
      - ./backend/wp-content/plugins/hwe-coupon-rules:/var/www/html/wp-content/plugins/hwe-coupon-rules
      - ./backend/wp-content/plugins/hwe-consent-log:/var/www/html/wp-content/plugins/hwe-consent-log
      - ./backend/wp-content/plugins/hwe-shipping:/var/www/html/wp-content/plugins/hwe-shipping
      - ./backend/wp-content/plugins/hwe-product-landing:/var/www/html/wp-content/plugins/hwe-product-landing
      - ./backend/wp-content/plugins/hwe-landings:/var/www/html/wp-content/plugins/hwe-landings
      - ./backend/wp-content/plugins/hwe-customer-identity:/var/www/html/wp-content/plugins/hwe-customer-identity
      - ./backend/wp-content/plugins/hwe-external-integration:/var/www/html/wp-content/plugins/hwe-external-integration
      - ./backend/wp-content/plugins/hwe-loyalty:/var/www/html/wp-content/plugins/hwe-loyalty
      - ./backend/scripts:/scripts:ro
      # Mismo bridge que `wordpress`: `wp hwe setup` escribe aquí
      # hwe-backup-config.json (ver HWE_BACKUPS_DIR en ese servicio).
      - ./backups:/var/www/hwe-backups
      # Repo host montado en /workspace: permite a generate-woo-keys.sh escribir
      # WC_CONSUMER_KEY/SECRET directamente en los .env en vez de imprimirlos
      # para copiar/pegar a mano (ver docs/INSTALL.md §4). Deben existir ANTES
      # de `docker compose run wpcli` (cp .env.example .env, etc.) — si faltan,
      # Docker los crearía como directorios vacíos.
      - ./.env:/workspace/.env
      - ./frontend/.env.local:/workspace/frontend/.env.local
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup.sh"]
    networks:
      - hwe_net

  # --------------------------------------------------------------------------
  # WP-Cron: ejecuta los eventos vencidos de WordPress y de los plugins (Action
  # Scheduler de WooCommerce, avisos de copia de seguridad…) por WP-CLI cada
  # minuto. Lee wp-config.php del volumen `wordpress_core`.
  # --------------------------------------------------------------------------
  wp-cron:
    image: wordpress:cli-php8.4
    container_name: hwe_wp_cron
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    user: "33:33" # www-data, mismo UID que el contenedor de WordPress
    environment:
      WORDPRESS_DB_HOST: "db:3306"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress}"
    volumes:
      - wordpress_core:/var/www/html
      - wordpress_content:/var/www/html/wp-content
      - ./backend/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./backend/wp-content/themes/hwe-headless-base:/var/www/html/wp-content/themes/hwe-headless-base
      - ./backend/wp-content/plugins/hwe-banners:/var/www/html/wp-content/plugins/hwe-banners
      - ./backend/wp-content/plugins/hwe-site-reviews:/var/www/html/wp-content/plugins/hwe-site-reviews
      - ./backend/wp-content/plugins/hwe-coupon-rules:/var/www/html/wp-content/plugins/hwe-coupon-rules
      - ./backend/wp-content/plugins/hwe-consent-log:/var/www/html/wp-content/plugins/hwe-consent-log
      - ./backend/wp-content/plugins/hwe-shipping:/var/www/html/wp-content/plugins/hwe-shipping
      - ./backend/wp-content/plugins/hwe-product-landing:/var/www/html/wp-content/plugins/hwe-product-landing
      - ./backend/wp-content/plugins/hwe-landings:/var/www/html/wp-content/plugins/hwe-landings
      - ./backend/wp-content/plugins/hwe-customer-identity:/var/www/html/wp-content/plugins/hwe-customer-identity
      - ./backend/wp-content/plugins/hwe-external-integration:/var/www/html/wp-content/plugins/hwe-external-integration
      - ./backend/wp-content/plugins/hwe-loyalty:/var/www/html/wp-content/plugins/hwe-loyalty
      # Mismo bridge que `wordpress`: el evento de notificación de copias lee
      # hwe-backup-status.json de aquí.
      - ./backups:/var/www/hwe-backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          wp cron event run --due-now --allow-root --quiet 2>&1 | sed 's/^/[wp-cron] /'
          sleep 60
        done
    networks:
      - hwe_net

  # --------------------------------------------------------------------------
  # Backup cron (manual desde el panel; el horario lo gobierna
  # hwe-backup-config.json, que el panel de wp-admin puede sobreescribir).
  # --------------------------------------------------------------------------
  backup:
    image: alpine:3.23
    container_name: hwe_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # La CARPETA de scripts, no un archivo suelto cada uno: un bind mount de un archivo
      # fija su inodo, y `git reset --hard` (el CD) lo sustituye por otro nuevo, así que el
      # contenedor seguía ejecutando la versión VIEJA hasta recrearse. El de una carpeta ve
      # siempre los archivos actuales.
      - ./backend/scripts:/opt/hwe/scripts:ro
      # Acceso a uploads para el tar de backup-cron.sh: en dev wp-content vive
      # en el volumen `wordpress_content` (no en el host, a diferencia de
      # prod), así que se monta el volumen directamente en vez de un bind path.
      - wordpress_content:/wp-content:ro
      - ./backups:/backups
    environment:
      MYSQL_HOST:          "db"
      MYSQL_USER:          "${MYSQL_USER:-wordpress}"
      MYSQL_PASSWORD:      "${MYSQL_PASSWORD:-wordpress}"
      MYSQL_DATABASE:      "${MYSQL_DATABASE:-wordpress}"
      BACKUP_DIR:          "/backups"
      BACKUP_RETAIN_DAYS:  "${BACKUP_RETAIN_DAYS:-14}"
      BACKUP_HOUR_UTC:     "${BACKUP_HOUR_UTC:-3}"
      HWE_BACKUP_LOCK_MAX_AGE_MIN: "${HWE_BACKUP_LOCK_MAX_AGE_MIN:-360}"
    entrypoint: ["/bin/sh", "/opt/hwe/scripts/backup-entrypoint.sh"]
    networks:
      - hwe_net

  # --------------------------------------------------------------------------
  # Redis (cache / rate-limit / idempotencia para el BFF del frontend)
  # --------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: hwe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - hwe_net

  # --------------------------------------------------------------------------
  # Frontend (Next.js — App Router — desarrollo)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev # imagen de desarrollo con hot-reload (prod: --target prod)
    container_name: hwe_frontend
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      # Liveness puro: /api/health devuelve 200 aunque Redis/WP estén caídos, así
      # que como sonda de contenedor medía otra cosa. El proceso vivo es lo único
      # que debe reiniciar el contenedor; la readiness la comprueba el despliegue.
      # Usa el fetch global de Node 24 (sin curl/wget).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    environment:
      # El navegador NO habla con WordPress (todo pasa por el BFF): el servidor Next
      # (SSR/ISR y Route Handlers) lo resuelve por la red interna de Docker.
      WORDPRESS_INTERNAL_API_URL: "${WORDPRESS_INTERNAL_API_URL:-http://wordpress:80/graphql}"
      # Origen autorizado para CSRF / verificación de Origin (Fases 1 y 4).
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:3000}"
      # Secreto JWT compartido con WordPress: el frontend verifica la firma
      # de los tokens localmente (server-only, sin prefijo NEXT_PUBLIC_).
      GRAPHQL_JWT_AUTH_SECRET_KEY: "${GRAPHQL_JWT_AUTH_SECRET_KEY:-changeme-super-secret-jwt-key}"
      # Secreto para firmar los tokens CSRF (signed double-submit).
      CSRF_SECRET: "${CSRF_SECRET:-changeme-super-secret-csrf-key}"
      # WooCommerce: APIs resueltas por la red interna de Docker.
      WC_API_URL: "${WC_API_URL:-http://wordpress:80/wp-json/wc/v3}"
      WC_STORE_API_URL: "${WC_STORE_API_URL:-http://wordpress:80/wp-json/wc/store/v1}"
      # Credenciales ck/cs SOLO de servidor (genéralas con generate-woo-keys.sh).
      WC_CONSUMER_KEY: "${WC_CONSUMER_KEY:-}"
      WC_CONSUMER_SECRET: "${WC_CONSUMER_SECRET:-}"
      # Secreto del webhook de WooCommerce (revalidación on-demand del catálogo).
      WC_WEBHOOK_SECRET: "${WC_WEBHOOK_SECRET:-changeme-super-secret-webhook-key}"
      # Secreto compartido con WordPress: firma la revalidación de site-config Y es el secreto
      # interno (X-HWE-Internal-Secret) que el BFF presenta a `hwe-bff-only` en cada llamada.
      HWE_REVALIDATION_SECRET: "${HWE_REVALIDATION_SECRET:-changeme-hwe-revalidation-secret}"
      # Conexión a Redis por la red interna de Docker.
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      WATCHPACK_POLLING: "true" # hot-reload fiable en volúmenes montados (Windows/WSL)
    volumes:
      - ./frontend:/app
      - /app/node_modules # node_modules aislado del host
      - /app/.next
    networks:
      - hwe_net

# ----------------------------------------------------------------------------
# Volúmenes y red
# ----------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  wordpress_core:
    driver: local
  wordpress_content:
    driver: local

networks:
  hwe_net:
    driver: bridge
