name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones antiguas del mismo ref para ahorrar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos para TODO el workflow: ningún job escribe en el repositorio
# (publicar imagen y desplegar vive en cd.yml). Sin este bloque, el
# GITHUB_TOKEN de cada job nace con permisos de escritura por defecto.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Calidad del frontend: tipos + lint + tests + build de producción.
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (lint · types · test · build)
    runs-on: ubuntu-latest
    # Un job colgado consume hasta 6 h de runner; con esto, como mucho 30 min.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # En el repositorio de una instancia hay que exportar el mismo interruptor que
      # usan los jobs `anti-instance`/`contract` para saltarse: `gitignore.test.ts`
      # describe la política del framework (su carpeta de instancia ignorada, el
      # patrón de plugins comentado) y en una instancia es justo al revés.
      HWE_INSTANCE: ${{ vars.HWE_INSTANCE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Formato (Prettier)
        run: npm run format:check

      # Sin este paso, una clave añadida solo a es.json llega a producción y /en
      # pinta la CLAVE CRUDA en pantalla, sin error de build ni de tipos.
      - name: Paridad i18n (es ↔ en)
        run: npm run i18n:check

      # `test:coverage` ejecuta TODA la suite (`vitest run --coverage`) y además
      # aplica los umbrales: una pasada, no dos. Antes se corría `npm run test`
      # otra vez y se gastaban minutos de runner sin cubrir nada nuevo.
      - name: Tests y cobertura
        run: npm run test:coverage

      # `next build` prerenderiza y consulta GraphQL durante el build; un runner
      # no tiene WordPress. El stub responde `{"data":{}}` a todo, así que se
      # construye con el CMS VACÍO: además de no necesitar WP, ejercita las ramas
      # de fallback y null-handling en cada build. Ver el encabezado del script.
      - name: Levantar endpoint GraphQL de pega
        run: |
          node ../.github/scripts/stub-graphql.mjs &
          npx wait-on http://127.0.0.1:8080 --timeout 30000

      - name: Build de producción
        run: npm run build
        env:
          # Ningún secreto real es necesario para compilar: las llamadas a WP/WC
          # que no son del prerender ocurren en runtime.
          WORDPRESS_INTERNAL_API_URL: http://127.0.0.1:8080/graphql

      # Falla ante avisos high/critical de TODO el árbol de dependencias salvo la
      # allowlist justificada de scripts/audit-gate.mjs (ver su cabecera). Va al
      # final porque un aviso nuevo no debe ocultar fallos de calidad del código.
      - name: Auditoría de dependencias (npm audit)
        run: npm run audit:gate

  # --------------------------------------------------------------------------
  # Tests PHP del backend (PHPUnit + Brain Monkey): el código propio de WordPress
  # (mu-plugins, plugins hwe-*, tema base) se prueba sin levantar WordPress; las
  # funciones de WP se simulan. PHP 8.4 = el de la imagen de producción.
  # --------------------------------------------------------------------------
  phpunit:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Ruta de la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validar composer.json y composer.lock
        run: composer validate --strict --no-interaction

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests PHP
        run: composer test

  # --------------------------------------------------------------------------
  # Puerta anti-instancia: el núcleo no conoce a ninguna instancia concreta.
  # Falla si en las rutas de núcleo aparece cualquier resto de una instancia.
  # --------------------------------------------------------------------------
  anti-instance:
    name: Puerta anti-instancia
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # En el repositorio de una instancia su propio código lleva los tokens del patrón:
    # la puerta solo aplica al framework. Interruptor fail-closed (solo `true`).
    if: ${{ vars.HWE_INSTANCE != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Grep anti-instancia en rutas de núcleo
        run: bash .github/scripts/check-anti-instance.sh

  # --------------------------------------------------------------------------
  # Contrato núcleo ↔ instancia: el ejemplo vivo se superpone al repo y debe
  # pasar la batería (tests PHP y TS, tipos y build). Si el contrato se rompe,
  # este job lo dice sin ensuciar el framework.
  # --------------------------------------------------------------------------
  contract:
    name: Contrato de instancia (ejemplo vivo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El job superpone `examples/instance-minimal/` al repo: en una instancia PISA su
    # `registry.ts` y sus `mu-plugins/instance/`, así que probaría otra cosa. Solo corre
    # en el repositorio del framework (interruptor fail-closed, valor exacto `true`).
    if: ${{ vars.HWE_INSTANCE != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Superponer el ejemplo vivo
        run: |
          cp -r examples/instance-minimal/backend/. backend/
          cp -r examples/instance-minimal/frontend/. frontend/
          git status --short

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend

      - name: Tests PHP (con el ejemplo)
        run: composer test
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Tests unitarios (con el ejemplo)
        run: npm run test
        working-directory: frontend

      - name: Type-check (con el ejemplo)
        run: npm run type-check
        working-directory: frontend

      - name: Levantar endpoint GraphQL de pega
        run: |
          node .github/scripts/stub-graphql.mjs &
          npx --prefix frontend wait-on http://127.0.0.1:8080 --timeout 30000

      - name: Build de producción (con el ejemplo)
        run: npm run build
        working-directory: frontend
        env:
          WORDPRESS_INTERNAL_API_URL: http://127.0.0.1:8080/graphql

  # --------------------------------------------------------------------------
  # Secret scanning: ningún secreto debe entrar al repositorio.
  # --------------------------------------------------------------------------
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      # La validación de secretos en producción (secret-guard.ts, §9 del AGENTS)
      # exige estos valores; se pasan dummy porque en CI no hay WP ni Redis reales.
      WORDPRESS_INTERNAL_API_URL: http://127.0.0.1:8080/graphql
      # El stub sirve también la REST de WooCommerce (pedidos del cliente, Store API).
      # Sin estas dos el BFF apunta a `http://wordpress:80` (el host del compose, que
      # no existe en el runner) y las vistas de la cuenta salen vacías.
      WC_API_URL: http://127.0.0.1:8080/wp-json/wc/v3
      WC_STORE_API_URL: http://127.0.0.1:8080/wp-json/wc/store/v1
      GRAPHQL_JWT_AUTH_SECRET_KEY: dummy-ci-jwt-secret-key-at-least-24-chars
      CSRF_SECRET: dummy-ci-csrf-secret-at-least-24-characters-len
      WC_WEBHOOK_SECRET: dummy-ci-webhook-secret-at-least-24-characters
      HWE_REVALIDATION_SECRET: dummy-ci-revalidation-secret-24-chars
      WC_CONSUMER_KEY: ck_dummy_ci_key
      WC_CONSUMER_SECRET: cs_dummy_ci_secret
      # Tiene que coincidir con el Origin que manda Playwright (baseURL) o toda
      # escritura responde 403. `next start` fija NODE_ENV=production, así que
      # el servidor pasa por las reglas de producción de secret-guard.ts.
      ALLOWED_ORIGIN: http://localhost:3000
      # Activa en el stub los tres medios de pago (por defecto solo el pago en
      # línea), la compra de invitado y los módulos que ejercitan los e2e (entre
      # ellos `loyalty`, con «Puntos» y «Referidos» encendidos), para que los
      # tests del checkout y de la cuenta encuentren el selector, el formulario
      # sin sesión y la calificación del pedido.
      STUB_SITE_CONFIG_EXTRA: '{"payments":{"gateway_enabled":true,"whatsapp_enabled":true,"cash_enabled":true},"ecommerce":{"checkout_login_required":false,"coupons_enabled":true},"modules":{"site-reviews":true,"coupon-rules":true,"consent-log":true,"customer-identity":true,"shipping":true,"banners":true,"product-landing":true,"landings":true,"loyalty":true},"loyalty":{"points_enabled":true,"referrals_enabled":true,"transfers_enabled":true,"currency_name":"punto","currency_name_plural":"puntos","point_value":"0.01","min_redeem":"100","max_redeem_per_order":"0","max_redeem_percent":"0","full_payment_enabled":false,"min_cash_due":"0.01","expiry_days":"0","cashback_enabled":false,"events":{"registration":"0","review":"0","birthday":"0"}},"banners":{"enabled":true},"integrations":{"analytics_provider":"ga4","analytics_id":"G-E2ETEST01"},"landings":{"registry":"guia-demo | Guía de demostración | article\nperfil-demo | Perfil de demostración | person","editorial":{"guia-demo":{"published":true,"url":{"base":"area","path":"guia-demo","path_en":"demo-guide"},"seo":{"title":"Guía de demostración","title_en":"Demo guide","description":"Una guía de prueba","description_en":"A test guide"},"lead_enabled":true,"lead_body":"<p>Entradilla de prueba</p>","lead_body_en":"<p>Test lead</p>","sections":{"s1":{"enabled":true,"order":"1","layout":"image-right","title":"Primera sección","title_en":"First section","body":"<p>Cuerpo uno</p>","body_en":"<p>Body one</p>"},"s2":{"enabled":true,"order":"2","layout":"prose-blocks","title":"Bloques con subtítulos","body":"<p>Introducción</p><h3>Primer bloque</h3><p>Texto uno</p><h3>Segundo bloque</h3><p>Texto dos</p>"}},"faq":{"enabled":true,"title":"Dudas","q1":{"question":"¿Funciona?","answer":"<p>Sí, funciona</p>"}},"closing":{"enabled":true,"title":"Para cerrar","text":"<p>Gracias por leer</p>","cta_label":"Ir a la tienda","cta_href":"/products","cta2_label":"Ataque","cta2_href":"javascript:alert(1)"}},"perfil-demo":{"published":true,"url":{"base":"root","path":"perfil-demo"},"lead_enabled":true,"lead_body":"<p>Perfil de prueba</p>"}}}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      # Los navegadores pesan cientos de MB y cambian solo al subir Playwright:
      # cachearlos ahorra la descarga en cada PR. `--with-deps` sigue corriendo
      # (apt es cuestión de segundos) por si cambian las dependencias del sistema.
      - name: Caché de navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium
      # Mismo stub que en el job `frontend`: el build lo necesita igual, y
      # `next start` sirve páginas que consultan GraphQL en runtime — sin él, los
      # specs verían errores de red en vez de la página vacía que esperan.
      - name: Levantar endpoint GraphQL de pega
        run: |
          node ../.github/scripts/stub-graphql.mjs &
          npx wait-on http://127.0.0.1:8080 --timeout 30000
      - name: Build de producción
        run: npm run build
      - name: Arrancar servidor
        run: npx next start --port 3000 &
      - name: Esperar servidor listo
        run: npx wait-on http://localhost:3000/api/health/live --timeout 60000
      - name: Tests e2e
        run: npx playwright test
      # Segunda pasada: instalación SIN módulos (la config por defecto). Cada módulo apagado
      # debe comportarse como si no existiera (rutas del BFF en 404, páginas inexistentes, fuera
      # del sitemap). Las páginas se prerenderizan en el build, así que lleva el suyo.
      - name: Parar el servidor y el stub de la primera pasada
        run: |
          # `next start` deja un proceso hijo `next-server` que no casa con «next start»: se
          # libera el puerto por número para que la segunda pasada no hable con el servidor viejo.
          pkill -f stub-graphql.mjs || true
          pkill -f next-server || true
          pkill -f "next start" || true
          fuser -k 3000/tcp 8080/tcp || true
          sleep 2
          ! (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null || { echo "el puerto 3000 sigue ocupado"; exit 1; }
      - name: Tests e2e con los módulos apagados
        env:
          STUB_SITE_CONFIG_EXTRA: '{"ecommerce":{"checkout_login_required":false}}'
        run: |
          node ../.github/scripts/stub-graphql.mjs &
          npx wait-on http://127.0.0.1:8080 --timeout 30000
          rm -rf .next
          npm run build
          npx next start --port 3000 &
          npx wait-on http://localhost:3000/api/health/live --timeout 60000
          npx playwright test tests/e2e/modules-off.spec.ts tests/e2e/smoke.spec.ts
      - name: Subir report HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Validación de configuración de infraestructura: detecta YAML/Caddyfile
  # roto o truncado y errores de sintaxis en los scripts de shell ANTES de
  # llegar a producción (guard anti-corrupción de archivos de config).
  # --------------------------------------------------------------------------
  config:
    name: Config (Compose · Caddy · scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose (dev)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validar docker-compose (prod)
        env:
          PUBLIC_DOMAIN: example.com
          ACME_EMAIL: admin@example.com
          MYSQL_PASSWORD: dummy-validation-value
          MYSQL_ROOT_PASSWORD: dummy-validation-value
          GRAPHQL_JWT_AUTH_SECRET_KEY: dummy-validation-value
          HWE_REVALIDATION_SECRET: dummy-validation-value
          CSRF_SECRET: dummy-validation-value
          HWE_SECRETS_KEY: dummy-validation-value
          HWE_2FA_KEY: dummy-validation-value
          WP_ADMIN_PASSWORD: dummy-validation-value
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validar Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      # Cada módulo tiene su entrada, README y MANUAL, está montado en los tres servicios de
      # WordPress y los catálogos de PHP y TS coinciden (la sección que no necesita pila).
      - name: Módulos completos
        run: sh backend/scripts/verify-modules.sh static

      - name: Sintaxis de scripts de shell
        run: |
          for f in backend/scripts/*.sh backend/scripts/lib/*.sh; do
            echo "· $f"
            sh -n "$f"
          done
