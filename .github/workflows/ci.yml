name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones antiguas del mismo ref para ahorrar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Calidad del frontend: tipos + lint + tests + build de producción.
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend (lint · types · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Formato (Prettier)
        run: npm run format:check

      # Sin este paso, una clave añadida solo a es.json llega a producción y /en
      # pinta la CLAVE CRUDA en pantalla, sin error de build ni de tipos.
      - name: Paridad i18n (es ↔ en)
        run: npm run i18n:check

      - name: Tests unitarios
        run: npm run test

      - name: Cobertura
        run: npm run test:coverage

      # `next build` prerenderiza y consulta GraphQL durante el build; un runner
      # no tiene WordPress. El stub responde `{"data":{}}` a todo, así que se
      # construye con el CMS VACÍO: además de no necesitar WP, ejercita las ramas
      # de fallback y null-handling en cada build. Ver el encabezado del script.
      - name: Levantar endpoint GraphQL de pega
        run: |
          node ../.github/scripts/stub-graphql.mjs &
          npx wait-on http://127.0.0.1:8080 --timeout 30000

      - name: Build de producción
        run: npm run build
        env:
          # Ningún secreto real es necesario para compilar: las llamadas a WP/WC
          # que no son del prerender ocurren en runtime.
          WORDPRESS_INTERNAL_API_URL: http://127.0.0.1:8080/graphql

      # Falla ante avisos high/critical de TODO el árbol de dependencias salvo la
      # allowlist justificada de scripts/audit-gate.mjs (ver su cabecera). Va al
      # final porque un aviso nuevo no debe ocultar fallos de calidad del código.
      - name: Auditoría de dependencias (npm audit)
        run: npm run audit:gate

  # --------------------------------------------------------------------------
  # Tests PHP del backend (PHPUnit + Brain Monkey): el código propio de WordPress
  # (mu-plugins, plugins hwe-*, tema base) se prueba sin levantar WordPress; las
  # funciones de WP se simulan. PHP 8.4 = el de la imagen de producción.
  # --------------------------------------------------------------------------
  phpunit:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Ruta de la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validar composer.json y composer.lock
        run: composer validate --strict --no-interaction

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests PHP
        run: composer test

  # --------------------------------------------------------------------------
  # Puerta anti-instancia: el núcleo no conoce a ninguna instancia concreta.
  # Falla si en las rutas de núcleo aparece cualquier resto de una instancia.
  # --------------------------------------------------------------------------
  anti-instance:
    name: Puerta anti-instancia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grep anti-instancia en rutas de núcleo
        run: bash .github/scripts/check-anti-instance.sh

  # --------------------------------------------------------------------------
  # Contrato núcleo ↔ instancia: el ejemplo vivo se superpone al repo y debe
  # pasar la batería (tests PHP y TS, tipos y build). Si el contrato se rompe,
  # este job lo dice sin ensuciar el framework.
  # --------------------------------------------------------------------------
  contract:
    name: Contrato de instancia (ejemplo vivo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Superponer el ejemplo vivo
        run: |
          cp -r examples/instance-minimal/backend/. backend/
          cp -r examples/instance-minimal/frontend/. frontend/
          git status --short

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend

      - name: Tests PHP (con el ejemplo)
        run: composer test
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Tests unitarios (con el ejemplo)
        run: npm run test
        working-directory: frontend

      - name: Type-check (con el ejemplo)
        run: npm run type-check
        working-directory: frontend

      - name: Levantar endpoint GraphQL de pega
        run: |
          node .github/scripts/stub-graphql.mjs &
          npx --prefix frontend wait-on http://127.0.0.1:8080 --timeout 30000

      - name: Build de producción (con el ejemplo)
        run: npm run build
        working-directory: frontend
        env:
          WORDPRESS_INTERNAL_API_URL: http://127.0.0.1:8080/graphql

  # --------------------------------------------------------------------------
  # Secret scanning: ningún secreto debe entrar al repositorio.
  # --------------------------------------------------------------------------
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # La validación de secretos en producción (secret-guard.ts, §9 del AGENTS)
      # exige estos valores; se pasan dummy porque en CI no hay WP ni Redis reales.
      WORDPRESS_INTERNAL_API_URL: http://127.0.0.1:8080/graphql
      GRAPHQL_JWT_AUTH_SECRET_KEY: dummy-ci-jwt-secret-key-at-least-24-chars
      CSRF_SECRET: dummy-ci-csrf-secret-at-least-24-characters-len
      WC_WEBHOOK_SECRET: dummy-ci-webhook-secret-at-least-24-characters
      HWE_REVALIDATION_SECRET: dummy-ci-revalidation-secret-24-chars
      WC_CONSUMER_KEY: ck_dummy_ci_key
      WC_CONSUMER_SECRET: cs_dummy_ci_secret
      # Tiene que coincidir con el Origin que manda Playwright (baseURL) o toda
      # escritura responde 403. `next start` fija NODE_ENV=production, así que
      # el servidor pasa por las reglas de producción de secret-guard.ts.
      ALLOWED_ORIGIN: http://localhost:3000
      # Activa en el stub los tres medios de pago (por defecto solo el pago en
      # línea), la compra de invitado y el módulo `site-reviews`, para que los e2e
      # del checkout y de la cuenta ejerciten el selector, el formulario sin sesión
      # y la calificación del pedido.
      STUB_SITE_CONFIG_EXTRA: '{"payments":{"gateway_enabled":true,"whatsapp_enabled":true,"cash_enabled":true},"ecommerce":{"checkout_login_required":false},"modules":{"site-reviews":true}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium
      # Mismo stub que en el job `frontend`: el build lo necesita igual, y
      # `next start` sirve páginas que consultan GraphQL en runtime — sin él, los
      # specs verían errores de red en vez de la página vacía que esperan.
      - name: Levantar endpoint GraphQL de pega
        run: |
          node ../.github/scripts/stub-graphql.mjs &
          npx wait-on http://127.0.0.1:8080 --timeout 30000
      - name: Build de producción
        run: npm run build
      - name: Arrancar servidor
        run: npx next start --port 3000 &
      - name: Esperar servidor listo
        run: npx wait-on http://localhost:3000/api/health/live --timeout 60000
      - name: Tests e2e
        run: npx playwright test
      - name: Subir report HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Validación de configuración de infraestructura: detecta YAML/Caddyfile
  # roto o truncado y errores de sintaxis en los scripts de shell ANTES de
  # llegar a producción (guard anti-corrupción de archivos de config).
  # --------------------------------------------------------------------------
  config:
    name: Config (Compose · Caddy · scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose (dev)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validar docker-compose (prod)
        env:
          PUBLIC_DOMAIN: example.com
          ACME_EMAIL: admin@example.com
          MYSQL_PASSWORD: dummy-validation-value
          MYSQL_ROOT_PASSWORD: dummy-validation-value
          GRAPHQL_JWT_AUTH_SECRET_KEY: dummy-validation-value
          HWE_REVALIDATION_SECRET: dummy-validation-value
          CSRF_SECRET: dummy-validation-value
          HWE_SECRETS_KEY: dummy-validation-value
          HWE_2FA_KEY: dummy-validation-value
          WP_ADMIN_PASSWORD: dummy-validation-value
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validar Caddyfile
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.9-alpine \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Sintaxis de scripts de shell
        run: |
          for f in backend/scripts/*.sh backend/scripts/lib/*.sh; do
            echo "· $f"
            sh -n "$f"
          done
