# ============================================================================
#  docker-compose.prod.yml — Stack de producción
#
#  Diferencias clave frente al compose de desarrollo:
#    ✔ Caddy como reverse proxy: TLS automático (Let's Encrypt), HTTP/3.
#    ✔ Frontend usa imagen pre-construida standalone (sin volúmenes de código).
#    ✔ WordPress y Redis sin puertos expuestos al host (solo acceso via Caddy).
#    ✔ WORDPRESS_DEBUG=0, WP_ENVIRONMENT_TYPE=production.
#    ✔ Límites de memoria/CPU/procesos por servicio y una red interna para db/redis.
#    ✔ Servicio `backup` con cron diario (03:00 UTC).
#    ✔ WordPress con healthcheck real (endpoint ligero, no /wp-json/).
#    ✔ Hardening: `security_opt: no-new-privileges` en todos los servicios.
#
#  Endurecimiento adicional recomendado (según tu plataforma; puede requerir
#  pruebas porque algunas imágenes escriben en disco o necesitan capacidades):
#    - `cap_drop: [ALL]` APLICADO a redis/frontend/caddy/backup (caddy con
#      cap_add NET_BIND_SERVICE). db y wordpress se dejan SIN cap_drop porque
#      su init/Apache necesita capacidades; endurécelos tras probar en staging.
#    - `read_only: true` + `tmpfs` APLICADO a redis. No se aplica a frontend
#      (caché ISR) ni a WordPress (escribe en disco) por defecto.
#    - Redes: `data` es INTERNA (sin salida a Internet) y solo la comparten
#      db, redis y sus consumidores; Caddy vive en `edge`+`app` y no puede
#      alcanzarla. WordPress, el frontend y wp-cli conservan salida por `app`
#      (SMTP, pasarelas, webhooks, descargas de setup.sh): no los muevas a `data`.
#    - Fijar imágenes por DIGEST (image: repo@sha256:...) para builds reproducibles.
#    - Restore PROBADO con backend/scripts/restore.sh (ver docs/RUNBOOK.md).
#
#  Uso:
#    # 1. Construir imagen del frontend (pasa los build-args que congela, ver
#    #    el bloque «Variables que se CONGELAN» de frontend/Dockerfile):
#    docker compose -f docker-compose.prod.yml --env-file .env.prod build frontend
#
#    # 2. Preparar entorno:
#    cp .env.prod.example .env.prod
#    nano .env.prod   # completar TODOS los secretos
#    mkdir -p backups
#    docker volume create hwe_db_data   # (o el nombre de HWE_DB_VOLUME): ver «Volúmenes»
#
#    # 3. Primer arranque (instala WordPress + plugins):
#    docker compose -f docker-compose.prod.yml --env-file .env.prod \
#        run --rm wpcli
#
#    # 4. Levantar la pila:
#    docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================================

# Rotación de logs compartida: evita que los json-file de Docker crezcan sin
# límite y llenen el disco del host. 3 archivos de 10 MB = 30 MB máx por servicio.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Constantes de WordPress, en UN solo sitio. `wp-config-docker.php` evalúa
# `WORDPRESS_CONFIG_EXTRA` del entorno del proceso en CADA carga (no lo hornea en
# wp-config.php), así que `wpcli` y `wp-cron` —que leen el wp-config.php del volumen
# `wordpress_core`— necesitan la variable igual que `wordpress`. Sin ella, WP-CLI corre
# sin `HWE_REVALIDATION_SECRET`, sin las claves AES y sin `WP_REDIS_*`.
x-wordpress-config-extra: &wordpress-config-extra |
  define( 'GRAPHQL_JWT_AUTH_SECRET_KEY', '${GRAPHQL_JWT_AUTH_SECRET_KEY:?GRAPHQL_JWT_AUTH_SECRET_KEY must be set}' );
  define( 'WP_ENVIRONMENT_TYPE', 'production' );
  define( 'HEADLESS_FRONTEND_URL',    'https://${PUBLIC_DOMAIN}' );
  // URL del frontend para llamadas SERVIDOR A SERVIDOR (revalidación ISR, medición de
  // consentimiento, webhooks que crea setup.sh). La pública llega —Caddy la atiende desde la
  // red `app`—, pero obliga a resolver el dominio público y salir por el ingress (CDN, TLS,
  // hairpin NAT); si eso falla, la revalidación se pierde en silencio (blocking => false).
  // El nombre del servicio va por la red interna, igual que el healthcheck del frontend.
  // Sobreescribible si el frontend viviera fuera de este compose.
  define( 'HEADLESS_FRONTEND_INTERNAL_URL', '${HEADLESS_FRONTEND_INTERNAL_URL:-http://frontend:3000}' );
  define( 'HEADLESS_ALLOWED_ORIGINS', 'https://${PUBLIC_DOMAIN}' );
  // Los MEDIOS se emiten SIEMPRE por el dominio público, donde Caddy sirve
  // /wp-content/*, aunque el panel viva en otro host (`siteurl` en
  // admin.<dominio>). Sin esto WordPress derivaría content_url() de
  // `siteurl` y emitiría la medioteca por un host que ni la CSP ni los
  // `remotePatterns` de next/image conocen. Los tres contenedores de
  // WordPress (wordpress, wpcli y wp-cron) la definen igual.
  define( 'WP_CONTENT_URL', 'https://${PUBLIC_DOMAIN}/wp-content' );
  define( 'HWE_REVALIDATION_SECRET',  '${HWE_REVALIDATION_SECRET:?HWE_REVALIDATION_SECRET must be set}' );
  // Claves AES dedicadas (estables entre recreaciones del contenedor). NO se
  // depende del fallback a AUTH_KEY autogenerado: si el volumen del core se
  // recrea o el core se reinstala, AUTH_KEY cambiaría y los secretos del
  // Control Center y los 2FA cifrados quedarían indescifrables.
  define( 'HWE_SECRETS_KEY', '${HWE_SECRETS_KEY:?HWE_SECRETS_KEY must be set}' );
  define( 'HWE_2FA_KEY',     '${HWE_2FA_KEY:?HWE_2FA_KEY must be set}' );
  define( 'HWE_BACKUPS_DIR', '/var/www/hwe-backups' );
  define( 'WP_REDIS_HOST', 'redis' );
  define( 'WP_REDIS_PORT', 6379 );
  // Prefijo + flush SELECTIVO: Redis es COMPARTIDO con el frontend (ISR,
  // tokens revocados, rate-limit, idempotencia, 2FA). Sin esto, «Flush cache»
  // de Redis Object Cache y `wp cache flush` hacen FLUSHDB y se llevan por
  // delante todo eso — incluidas las listas de revocación (un token revocado
  // volvería a valer). Con él solo borran las claves `hwe-wp:*`.
  define( 'WP_REDIS_PREFIX', 'hwe-wp:' );
  define( 'WP_REDIS_SELECTIVE_FLUSH', true );
  define( 'WP_CACHE', true );
  define( 'HWE_TRUSTED_PROXY_COUNT', ${TRUSTED_PROXY_COUNT:-1} );
  // Login del panel en /<slug> en vez de /wp-login.php (hwe-login-slug.php). Vacío = sin mover.
  define( 'HWE_LOGIN_SLUG', '${HWE_LOGIN_SLUG:-}' );
  // IPs que pueden llegar a GraphQL como integración externa (módulo
  // `external-integration`). Vacío = nadie. Ver docs/SECURITY.md.
  define( 'HWE_INTEGRATION_ALLOWED_IPS', '${HWE_INTEGRATION_ALLOWED_IPS:-}' );
  define( 'DISALLOW_FILE_EDIT', true );
  define( 'DISALLOW_FILE_MODS', true );
  // WP-Cron NO se dispara en cada visita (el spawn HTTP de WordPress hacia sí
  // mismo es frágil detrás de Caddy y cuesta una petición PHP por vista): lo
  // ejecuta el servicio `wp-cron` por WP-CLI cada minuto.
  define( 'DISABLE_WP_CRON', true );

services:

  # ── Caddy: reverse proxy + TLS automático ───────────────────────────────────
  caddy:
    image: caddy:2.11-alpine
    # No se baja una imagen nueva a mitad de un despliegue: actualizar bases es un
    # paso explícito (`docker compose pull`) revisable, no una sorpresa del `up -d`.
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_caddy
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sitios opcionales (p. ej. el panel en admin.<dominio>): ver caddy/README.md.
      - ./caddy/conf.d:/etc/caddy/conf.d:ro
      # Los medios los sirve CADDY desde disco, no los workers de Apache (ver el
      # bloque /wp-content/* del Caddyfile). Mismo montaje, en SOLO LECTURA y en
      # el mismo orden que el servicio `wordpress`: sin el bind mount de wp-content
      # encima vería la copia que quedó dentro del volumen del core.
      - wordpress_core:/var/www/html:ro
      - ./backend/wp-content:/var/www/html/wp-content:ro
      - caddy_data:/data          # certificados TLS persistentes
      - caddy_config:/config      # configuración Caddy persistente
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?PUBLIC_DOMAIN must be set}"
      # Mismo valor que en WordPress: Caddy enruta /<slug> al panel. Con la
      # variable vacía, Caddy recibe el valor por defecto porque un placeholder
      # `{$VAR:defecto}` distingue «sin definir» de «definida vacía»: con vacío
      # renderizaría `/` y secuestraría la raíz del sitio.
      HWE_LOGIN_SLUG: "${HWE_LOGIN_SLUG:-wp-login.php}"
      # Host del panel (opcional). Con valor, `/wp-admin` y el login redirigen allí;
      # el sitio del panel lo define caddy/conf.d/admin.caddy (ver caddy/README.md).
      ADMIN_DOMAIN:  "${ADMIN_DOMAIN:-}"
      ACME_EMAIL:    "${ACME_EMAIL:?ACME_EMAIL must be set}"
      # Red de seguridad del runtime Go: si el proceso se acerca al límite del
      # contenedor, el GC aprieta ANTES de que el kernel lo mate.
      GOMEMLIMIT: "100MiB"
    depends_on:
      # `service_started`, no `healthy`: el BFF está diseñado para degradar
      # (catálogo cacheado, rate-limit fail-open) y Caddy tiene `lb_try_duration`,
      # así que un WordPress lento no debe impedir arrancar el sitio entero. La
      # readiness real la exige el gate del despliegue (`?ready=1`).
      frontend:
        condition: service_started
      wordpress:
        condition: service_started
    healthcheck:
      # La API de administración escucha solo en loopback y no toca el sitio:
      # comprueba que Caddy está vivo y ha cargado su configuración, sin
      # depender de que el upstream responda. 127.0.0.1 y no `localhost`: en la
      # imagen `localhost` resuelve primero a ::1, donde la API no escucha.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # `edge` la comunica con el frontend; `app` con WordPress (panel, REST y
    # medios). NO está en `data`: Caddy no puede resolver ni alcanzar `db` ni
    # `redis` — el aislamiento es de red, no solo de aplicación.
    networks:
      - edge
      - app
    init: true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 512

  # ── Base de datos ──────────────────────────────────────────────────────────
  db:
    image: mariadb:11.8
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_db
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_DATABASE:      "${MYSQL_DATABASE:-wordpress}"
      MARIADB_USER:          "${MYSQL_USER:-wordpress}"
      MARIADB_PASSWORD:      "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}"
    # Los defaults de MariaDB (innodb_buffer_pool_size=128M, max_connections=151)
    # no tienen en cuenta el límite de memoria del contenedor (512m, abajo). 256M
    # de buffer pool (50 %) deja margen para conexiones, sort buffers y el SO; y
    # 50 conexiones sobran: todo el tráfico pasa por el BFF, no hay muchos
    # clientes concurrentes directos. Si subes el límite de memoria, sube también
    # `MYSQL_INNODB_BUFFER_POOL_SIZE` (≈ 50 % del límite).
    #
    # `max-allowed-packet=64M`: el default (16M) rompía un restore de un dump con
    # filas grandes; 64M es la mitad de `post_max_size` (uploads.ini) y evita
    # reservar de más por conexión.
    # `slow-query-log` + `long-query-time=1`: sin él no hay forma de ver la
    # consulta que tumba el sitio. `skip-name-resolve`: no resolver DNS inverso
    # por conexión (todo llega por IP de la red interna).
    command:
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-50}
      - --max-allowed-packet=64M
      - --slow-query-log=1
      - --long-query-time=1
      - --skip-name-resolve
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      # El init de MariaDB sobre un volumen vacío puede tardar más que los
      # reintentos: sin `start_period`, el primer `up` fallaba por
      # `depends_on: service_healthy` y había que repetirlo.
      start_period: 60s
      retries: 10
    # Solo en `data` (interna): la base de datos no necesita —ni debe tener—
    # salida a Internet, y Caddy no puede alcanzarla.
    networks:
      - data
    init: true
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2"
          pids: 512

  # ── WordPress headless ──────────────────────────────────────────────────────
  # Puerto 8080 NO expuesto al host: solo accesible via Caddy en la red interna.
  wordpress:
    image: wordpress:7.1-php8.4-apache
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_wordpress
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST:     "db:3306"
      WORDPRESS_DB_USER:     "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"
      WORDPRESS_DB_NAME:     "${MYSQL_DATABASE:-wordpress}"
      WORDPRESS_DEBUG:       "0"
      # Inyecta PHP directamente en wp-config.php (clave JWT, entorno, etc.).
      # Compartido con `wpcli` y `wp-cron` (ver `x-wordpress-config-extra`).
      WORDPRESS_CONFIG_EXTRA: *wordpress-config-extra
    volumes:
      # Núcleo de WordPress (wp-config.php incluido) en un volumen con nombre,
      # compartido con `wpcli`, `wp-cron` y —en solo lectura— `caddy`. Sin él, cada
      # contenedor vive con su propia copia y wp-cli nunca ve el wp-config.php que
      # este servicio genera al arrancar («This does not seem to be a WordPress
      # installation»).
      #
      # ⚠ Consecuencia: el core NO se actualiza al subir la etiqueta de la imagen
      # (el entrypoint solo copia si falta index.php). Tras un `pull`, ejecuta
      # `wpcli /scripts/update-core.sh --apply <versión>` y reinicia este servicio;
      # procedimiento en docs/RUNBOOK.md §10.
      - wordpress_core:/var/www/html
      - ./backend/wp-content:/var/www/html/wp-content
      - ./backend/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      # Directorio de backups (dumps + archivos de control del panel de
      # Backups), FUERA del docroot de Apache (/var/www/html) para que Caddy
      # jamás pueda servirlo. Mismo host path que el contenedor `backup`
      # (montado ahí en /backups).
      - ./backups:/var/www/hwe-backups
      # OPcache optimizado para producción (validate_timestamps=0): tras
      # actualizar mu-plugins/plugins hay que reiniciar este contenedor.
      - ./backend/config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      # Techo de procesos de Apache. Va en `conf-enabled/`, que se lee DESPUÉS de
      # `mods-enabled/mpm_prefork.conf`, así que gana sin pisar el archivo de la
      # distribución; el prefijo `zz-` fija el orden alfabético de inclusión. Sin esto
      # la imagen permite 150 workers y el contenedor muere por OOM bajo carga (ver el
      # propio archivo, que explica cómo dimensionarlo respecto al límite de memoria).
      - ./backend/config/apache-mpm.conf:/etc/apache2/conf-enabled/zz-hwe-mpm.conf:ro
      # Caché larga de `uploads/` en el origen (lo que ve el optimizador de
      # next/image por la red interna, sin pasar por Caddy). Ver el propio archivo.
      - ./backend/config/apache-headers.conf:/etc/apache2/conf-enabled/zz-hwe-headers.conf:ro
    healthcheck:
      # Endpoint LIGERO (una categoría) en lugar de `/wp-json/`, que con
      # WooCommerce devuelve >1 MB y arranca PHP entero cada 30 s. Mismo criterio
      # que en desarrollo.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost/wp-json/wp/v2/categories?per_page=1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    # `app` para Caddy y para la salida a Internet que WordPress necesita
    # (SMTP, actualizaciones de plugins, webhooks salientes); `data` para db y
    # redis (red interna, sin ruta al exterior).
    networks:
      - app
      - data
    init: true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "2"
          pids: 512

  # ── WP-CLI (primer arranque, bajo demanda) ─────────────────────────────────
  wpcli:
    image: wordpress:cli-php8.4
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_wpcli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
      # service_started (no healthy): evita el deadlock circular en el primer arranque
      # (wordpress no es healthy hasta que setup.sh —que corre aquí— lo instala).
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST:     "db:3306"
      WORDPRESS_DB_USER:     "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      WORDPRESS_DB_NAME:     "${MYSQL_DATABASE:-wordpress}"
      # Mismas constantes que `wordpress`: `wp-config-docker.php` evalúa esta
      # variable del entorno del proceso, así que sin ella WP-CLI corre sin
      # `HWE_REVALIDATION_SECRET`, sin las claves AES y sin `WP_REDIS_*`.
      WORDPRESS_CONFIG_EXTRA: *wordpress-config-extra
      WP_URL:          "${WORDPRESS_PUBLIC_URL:-https://localhost}"
      WP_TITLE:        "${WP_TITLE:-HWE-Orbit}"
      WP_ADMIN_USER:   "${WP_ADMIN_USER:-admin}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD:?WP_ADMIN_PASSWORD must be set}"
      WP_ADMIN_EMAIL:  "${WP_ADMIN_EMAIL:-admin@example.com}"
      HEADLESS_FRONTEND_URL: "${HEADLESS_FRONTEND_URL:-http://frontend:3000}"
      # Para los webhooks que crea setup.sh (WooCommerce → BFF, servidor a servidor).
      HEADLESS_FRONTEND_INTERNAL_URL: "${HEADLESS_FRONTEND_INTERNAL_URL:-http://frontend:3000}"
      WC_WEBHOOK_SECRET:     "${WC_WEBHOOK_SECRET:-}"
    volumes:
      - wordpress_core:/var/www/html
      - ./backend/wp-content:/var/www/html/wp-content
      - ./backend/scripts:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup.sh"]
    # Corre como 33:33 y no usa sudo/su: no necesita ganar privilegios.
    security_opt:
      - no-new-privileges:true
    # `app` para que `setup.sh` pueda descargar WordPress, WooCommerce y los
    # plugins (necesita Internet); `data` para hablar con db y redis.
    networks:
      - app
      - data
    init: true

  # ── Redis (caché de objetos WP + rate-limit BFF) ────────────────────────────
  redis:
    # El tag fija el minor: `redis:8-alpine` es un major flotante (hoy resuelve
    # a 8.10.x) y dos despliegues del mismo commit podían usar versiones distintas.
    image: redis:8.10-alpine
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_redis
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # maxmemory por debajo del límite del contenedor (256m) para que Redis
    # gestione la memoria con evicción LRU en lugar de que el kernel lo mate por
    # OOM (lo que perdería TODA la caché). allkeys-lru: las claves de seguridad
    # (revocación, idempotencia) son recientes/con TTL, así que sobreviven.
    command:
      [
        "redis-server",
        # Instantánea cada 15 min si hubo al menos un cambio, no cada minuto: la caché
        # y el rate-limit se reescribían entera cada minuto (cientos de MB) sin
        # que nadie necesitara esa durabilidad.
        "--save", "900", "1",
        "--loglevel", "warning",
        "--maxmemory", "220mb",
        # allkeys-lru (no volatile-lru): las claves de seguridad no siempre tienen
        # TTL y con una política que solo expulsa claves volátiles, al llenarse el
        # límite Redis devolvería error de escritura y el rate-limit dejaría de
        # contar. Perder una clave por presión de memoria es menos malo que un
        # Redis que se niega a escribir.
        "--maxmemory-policy", "allkeys-lru",
        # Si el `bgsave` falla (disco lleno), Redis deja de aceptar escrituras por
        # defecto —justo cuando el disco está mal—. Aquí los datos son caché y
        # estado reconstruible: seguir sirviendo es mejor que fallar cerrado.
        "--stop-writes-on-bgsave-error", "no",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Solo en `data` (interna): nadie fuera del stack la alcanza y ella no sale.
    networks:
      - data
    init: true
    # Margen para que termine el `bgsave` en curso antes del SIGKILL.
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 256

  # ── Frontend (Next.js standalone — imagen pre-construida) ───────────────────
  # Puerto 3000 NO expuesto al host: Caddy es el punto de entrada público.
  frontend:
    image: "${FRONTEND_IMAGE:-hwe-frontend:prod}"
    # Para construirla EN el servidor (`docker compose … build frontend`), con los
    # argumentos que el build CONGELA (CSP, remotePatterns). La imagen que publica
    # el workflow de CD se construye con los mismos (ver .github/workflows/cd.yml).
    build:
      context: ./frontend
      target: prod
      # Sin `network:` el build no alcanza `wordpress:80`: el prerender usa la
      # config por defecto y ISR regenera las páginas con el contenido real al
      # primer acceso (sin pila de WordPress en el build es el modo normal). Si
      # quieres que el build prerenderice contra WordPress, pon aquí el nombre REAL
      # de la red (`<proyecto>_app`, sin prefijo automático en `build.network`)
      # y construye con el builder clásico (`DOCKER_BUILDKIT=0`), el único que
      # admite una red por nombre.
      args:
        WORDPRESS_PUBLIC_URL:        "${WORDPRESS_PUBLIC_URL:-https://${PUBLIC_DOMAIN}}"
        WORDPRESS_INTERNAL_API_URL:  "${BUILD_WORDPRESS_INTERNAL_API_URL:-}"
        NEXT_PUBLIC_SITE_URL:        "https://${PUBLIC_DOMAIN}"
        CSP_ANALYTICS_PROVIDERS:     "${CSP_ANALYTICS_PROVIDERS:-}"
        SENTRY_DSN:                  "${SENTRY_DSN:-}"
        NEXT_PUBLIC_SENTRY_DSN:      "${NEXT_PUBLIC_SENTRY_DSN:-}"
        NEXT_PUBLIC_SENTRY_REPLAY:   "${NEXT_PUBLIC_SENTRY_REPLAY:-}"
        # Paciencia y ritmo del prerender SOLO en el build (con WordPress cargado por
        # el propio build, los defaults se quedan cortos). Vacíos = defaults.
        GRAPHQL_TIMEOUT_MS:          "${BUILD_GRAPHQL_TIMEOUT_MS:-}"
        CONFIG_TIMEOUT_MS:           "${BUILD_CONFIG_TIMEOUT_MS:-}"
        NEXT_STATIC_PAGE_GENERATION_TIMEOUT: "${BUILD_STATIC_PAGE_TIMEOUT:-}"
        NEXT_STATIC_GENERATION_MAX_CONCURRENCY: "${BUILD_STATIC_MAX_CONCURRENCY:-}"
        NEXT_STATIC_GENERATION_MIN_PAGES_PER_WORKER: "${BUILD_STATIC_MIN_PAGES_PER_WORKER:-}"
        PRERENDER_LONG_TAIL:         "${PRERENDER_LONG_TAIL:-}"
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_frontend
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      # `service_started`: el frontend sabe servir catálogo cacheado y degradar
      # si WordPress/Redis aún no están listos; bloquear su arranque convertía un
      # WordPress lento en un sitio entero caído. La readiness la exige el CD.
      wordpress:
        condition: service_started
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL:             "https://${PUBLIC_DOMAIN}"
      # Origen público de los medios (lib/wordpress/media.ts): lo usa `CmsImage` para
      # reconocer una imagen del WordPress propio y reescribirla al origen interno.
      WORDPRESS_PUBLIC_URL:             "${WORDPRESS_PUBLIC_URL:-https://${PUBLIC_DOMAIN}}"
      WORDPRESS_INTERNAL_API_URL:       "http://wordpress:80/graphql"
      ALLOWED_ORIGIN:                   "https://${PUBLIC_DOMAIN}"
      GRAPHQL_JWT_AUTH_SECRET_KEY:      "${GRAPHQL_JWT_AUTH_SECRET_KEY}"
      CSRF_SECRET:                      "${CSRF_SECRET:?CSRF_SECRET must be set}"
      WC_API_URL:                       "http://wordpress:80/wp-json/wc/v3"
      WC_STORE_API_URL:                 "http://wordpress:80/wp-json/wc/store/v1"
      WC_CONSUMER_KEY:                  "${WC_CONSUMER_KEY}"
      WC_CONSUMER_SECRET:               "${WC_CONSUMER_SECRET}"
      WC_WEBHOOK_SECRET:                "${WC_WEBHOOK_SECRET}"
      REDIS_URL:                        "redis://redis:6379"
      HWE_REVALIDATION_SECRET:          "${HWE_REVALIDATION_SECRET}"
      # Guarda de staging: `true` saca el sitio de los buscadores (robots.txt y
      # X-Robots-Tag, en ejecución) sin tocar el Control Center. Vacía en producción.
      HWE_NOINDEX:                      "${HWE_NOINDEX:-}"
      # IndexNow (Bing, Yandex…): clave de 8–128 caracteres; vacía = apagado.
      INDEXNOW_KEY:                     "${INDEXNOW_KEY:-}"
      # Sin valor por defecto: producción sin pasarela decidida falla cerrada
      # (503 en el cobro y 404 en el webhook de pruebas), nunca cae a `noop`.
      # `noop` no es válido en producción: el guard de arranque lo rechaza y el
      # registro de pagos no lo activa ni atiende su webhook.
      PAYMENT_PROVIDER:                 "${PAYMENT_PROVIDER:-}"
      PAYMENT_CURRENCY:                 "${PAYMENT_CURRENCY:-EUR}"
      NEXT_PUBLIC_PAYMENT_RETURN_URL:   "https://${PUBLIC_DOMAIN}/checkout/return"
      # Solo para el sandbox `noop` (desarrollo/test). En producción déjalo vacío:
      # el literal público del repo no es un secreto y el guard lo rechaza.
      NOOP_INTEGRITY_SECRET:            "${NOOP_INTEGRITY_SECRET:-}"
      # ── Paciencia EN RUNTIME con WordPress ─────────────────────────────────
      # Una petición ABORTADA por plazo no entra en el Data Cache de Next: la
      # página que expira no cachea nada, el siguiente visitante vuelve a pagar el
      # viaje entero y el sitio nunca se calienta. Con WordPress cargado (un
      # rastreador recorriendo el catálogo) los 10 s / 5 s por defecto convierten la
      # lentitud en una cascada de 500. Una página lenta que termina y se cachea es
      # estrictamente mejor que un 500 servido indefinidamente; con la caché
      # caliente ninguna petición se acerca a estos valores.
      GRAPHQL_TIMEOUT_MS:               "${RUNTIME_GRAPHQL_TIMEOUT_MS:-25000}"
      CONFIG_TIMEOUT_MS:                "${RUNTIME_CONFIG_TIMEOUT_MS:-15000}"
      LOG_LEVEL:                        "${LOG_LEVEL:-info}"
    volumes:
      # Toda la caché de Next (ISR + fetch-cache + imágenes optimizadas): antes
      # solo se persistía `cache/images`, así que cada `up -d` dejaba el ISR en
      # frío y todo el sitio se regeneraba contra WordPress a la vez. La imagen
      # crea `.next/cache` con el dueño correcto (uid 1001); ver frontend/Dockerfile.
      - next_cache:/app/.next/cache
    healthcheck:
      # Liveness puro (`/api/health`) devuelve 200 aunque Redis y WordPress estén
      # caídos y hace dos pings de red cada 30 s: como sonda de contenedor, mide
      # otra cosa. `/api/health/live` solo comprueba que el proceso responde; la
      # readiness real (`?ready=1`) la exige el gate del despliegue.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    networks:
      # `edge` para Caddy, `app` para WordPress y `data` para db/redis. Sale a
      # Internet por `edge` (pasarelas de pago, Sentry, webhooks salientes).
      - edge
      - app
      - data
    init: true
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2"
          pids: 512

  # ── WP-Cron (eventos programados de WordPress y de los plugins) ─────────────
  # `DISABLE_WP_CRON` está activo en `wordpress`: este servicio ejecuta por WP-CLI
  # los eventos vencidos cada minuto. Sin él nada programado correría (avisos de
  # copia de seguridad, cancelaciones automáticas, Action Scheduler de WooCommerce).
  wp-cron:
    image: wordpress:cli-php8.4
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_wp_cron
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST:     "db:3306"
      WORDPRESS_DB_USER:     "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD}"
      WORDPRESS_DB_NAME:     "${MYSQL_DATABASE:-wordpress}"
      # Mismas constantes que `wordpress` (ver `x-wordpress-config-extra`): el
      # wp-config.php del volumen `wordpress_core` las evalúa del entorno de ESTE
      # proceso en cada carga, no las trae horneadas.
      WORDPRESS_CONFIG_EXTRA: *wordpress-config-extra
    volumes:
      - wordpress_core:/var/www/html
      - ./backend/wp-content:/var/www/html/wp-content
      # Mismo directorio que `wordpress`: el evento de notificación de copias lee
      # hwe-backup-status.json de aquí.
      - ./backups:/var/www/hwe-backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while true; do
          # `flock -n`: si la corrida anterior sigue viva (Action Scheduler,
          # backups), esta se SALTA en vez de arrancar en paralelo y duplicar
          # acciones. `timeout 300`: una corrida colgada no se eterniza.
          flock -n /tmp/wp-cron.lock timeout 300 wp cron event run --due-now --allow-root --quiet 2>&1 | sed 's/^/[wp-cron] /'
          sleep 60
        done
    # `app` porque algunos eventos hacen peticiones salientes (webhooks de
    # pasarela, ERP) y `data` para db/redis.
    networks:
      - app
      - data
    init: true
    # Trabajo de fondo: cede ante el tráfico.
    cpu_shares: 256
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 256

  # ── Backup cron (diario 03:00 UTC) ──────────────────────────────────────────
  backup:
    # Imagen propia con mariadb-client y jq YA instalados: el contenedor solo
    # está en la red interna `data` (sin Internet), así que un `apk add` en cada
    # arranque fallaba y lo dejaba en bucle de reinicio sin hacer ninguna copia.
    # `pull_policy: build` evita que Compose intente bajar esta etiqueta local.
    image: hwe-backup:prod
    build:
      context: ./backend/docker/backup
    pull_policy: build
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_backup
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # `crond` (busybox) fija usuario y grupos ANTES de lanzar cada tarea, aunque ya sea
    # root. Sin estas dos capacidades falla con «can't set groups: Operation not
    # permitted» y descarta la tarea EN SILENCIO: el contenedor sale sano, el cron está
    # programado y no se hace ninguna copia (reproducido con alpine:3.23; con las dos
    # capacidades la tarea corre). Es lo único que se devuelve tras `cap_drop: ALL`.
    cap_add:
      - SETUID
      - SETGID
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # La CARPETA de scripts, no un archivo suelto cada uno: un bind mount de un archivo
      # fija su inodo, y `git reset --hard` (el CD) lo sustituye por otro nuevo, así que el
      # contenedor seguía ejecutando la versión VIEJA hasta recrearse. El de una carpeta ve
      # siempre los archivos actuales.
      - ./backend/scripts:/opt/hwe/scripts:ro
      # wp-content completo (solo lectura): acceso a uploads + hwe-backup-config.json
      - ./backend/wp-content:/wp-content:ro
      - ./backups:/backups
    environment:
      MYSQL_HOST:          "db"
      MYSQL_USER:          "${MYSQL_USER:-wordpress}"
      MYSQL_PASSWORD:      "${MYSQL_PASSWORD}"
      MYSQL_DATABASE:      "${MYSQL_DATABASE:-wordpress}"
      BACKUP_DIR:          "/backups"
      BACKUP_RETAIN_DAYS:  "${BACKUP_RETAIN_DAYS:-14}"
      BACKUP_HOUR_UTC:     "${BACKUP_HOUR_UTC:-3}"
      HWE_BACKUP_LOCK_MAX_AGE_MIN: "${HWE_BACKUP_LOCK_MAX_AGE_MIN:-360}"
    entrypoint: ["/bin/sh", "/opt/hwe/scripts/backup-entrypoint.sh"]
    # Solo en `data`: habla con `db`, escribe en ./backups y no necesita Internet
    # (el envío cifrado fuera del servidor, si se configura, es un cron del host).
    networks:
      - data
    init: true
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "1"
          pids: 256

  # ── Purga de la caché de imágenes ──────────────────────────────────────────
  # `next/image` no hace GC de su caché en disco: cada variante redimensionada se
  # queda para siempre y crece hasta llenar el disco. Este servicio borra una vez
  # al día las variantes que no se usan desde hace `CACHE_IMAGES_MAX_AGE_DAYS`
  # (30) y no toca el resto de la caché (ISR). Se regeneran bajo demanda.
  cache-prune:
    image: alpine:3.23
    pull_policy: if_not_present
    container_name: ${HWE_CONTAINER_PREFIX:-hwe}_cache_prune
    logging: *default-logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Lectura-escritura: este servicio BORRA dentro de `images/`.
      - next_cache:/cache
    environment:
      CACHE_IMAGES_MAX_AGE_DAYS: "${CACHE_IMAGES_MAX_AGE_DAYS:-30}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while true; do
          find /cache/images -type f -mtime +"$${CACHE_IMAGES_MAX_AGE_DAYS}" -print -delete 2>/dev/null | sed 's/^/[cache-prune] borrada /'
          sleep 86400
        done
    # No necesita red de ningún tipo.
    network_mode: none
    init: true
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
          pids: 64

# ── Volúmenes ──────────────────────────────────────────────────────────────────
volumes:
  # Núcleo de WordPress compartido entre wordpress, wpcli, wp-cron y caddy (solo lectura).
  wordpress_core:
    driver: local
  # La base de datos es EXTERNA a propósito: un volumen normal se borra con
  # `docker compose down -v`, y su nombre depende del nombre del proyecto (el del
  # directorio): clonar el repo en otra ruta, o un `-p` distinto, creaba un volumen NUEVO
  # y VACÍO y arrancaba la tienda con una base de datos en blanco, sin ningún error. Un
  # volumen externo no lo toca `down -v`, y si no existe `up` FALLA en vez de crearlo.
  # Se crea una vez: `docker volume create ${HWE_DB_VOLUME:-hwe_db_data}`.
  db_data:
    external: true
    name: ${HWE_DB_VOLUME:-hwe_db_data}
  redis_data:
    driver: local
  # Caché de Next compartida (ISR + fetch-cache + imágenes): sobrevive al
  # despliegue. Es regenerable, pero rehacerla cuesta CPU de sharp y una tormenta
  # de peticiones a WordPress.
  next_cache:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ── Redes ─────────────────────────────────────────────────────────────────────
# Tres capas en vez de una red plana. Antes, Caddy podía resolver y alcanzar
# `db:3306` y `redis:6379`, y cualquier contenedor comprometido llegaba a la base
# de datos y al Redis que guarda revocaciones, rate-limit e idempotencia.
#
#   edge : Caddy ↔ frontend (tráfico HTTP interno).
#   app  : Caddy ↔ frontend ↔ WordPress, y salida a Internet de WordPress, del
#          BFF (pasarelas de pago, Sentry) y de wp-cli/wp-cron (descargas,
#          webhooks salientes). NO es interna a propósito: sin salida, `setup.sh`
#          no podría descargar WordPress/plugins y las pasarelas no responderían.
#   data : INTERNA (sin ruta al exterior). Solo db, redis y sus consumidores.
#          Caddy no está aquí, así que no puede alcanzar la capa de datos.
networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
