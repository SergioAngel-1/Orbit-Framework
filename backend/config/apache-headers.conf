# ============================================================================
#  apache-headers.conf — Caché de los MEDIOS servidos por Apache (producción)
#
#  Se monta en `/etc/apache2/conf-enabled/`, igual que `apache-mpm.conf`, con
#  prefijo `zz-` para fijar el orden de inclusión. Solo en
#  docker-compose.prod.yml.
#
#  ── Por qué existe ─────────────────────────────────────────────────────────
#  Apache no manda NINGUNA cabecera de caché para `/wp-content/uploads`: la
#  respuesta a un `.png` trae solo `ETag` y `Last-Modified`.
#
#  El Caddyfile SÍ declara `max-age=31536000` para `/wp-content/*`, pero eso solo
#  cubre al navegador que pide el original por el dominio público. El consumidor
#  que importa es OTRO: el optimizador de `next/image`, que hace el fetch en el
#  SERVIDOR contra `http://wordpress:80/...` por la red interna de Docker y por
#  tanto NO PASA POR CADDY. Recibe una respuesta sin `Cache-Control`, y Next —que
#  toma el mayor entre el `max-age` del origen y su `minimumCacheTTL`— cae a su
#  defecto de 4 horas: cada variante del catálogo vuelve a pasar por sharp seis
#  veces al día sobre la misma CPU que comparten Apache, MariaDB y el propio Next.
#
#  ── Por qué un año es correcto y no temerario ──────────────────────────────
#  Los uploads de WordPress son INMUTABLES: si se sube otro archivo con el mismo
#  nombre, WP no lo pisa, lo versiona (`foto-1.png`). Una URL de
#  `/wp-content/uploads` nunca cambia de contenido, así que cachearla un año es
#  la política correcta — la misma que ya declara el Caddyfile.
#
#  No se toca nada fuera de `uploads/`: las respuestas de PHP (GraphQL, REST,
#  wp-admin) deben seguir sin cachear, y este bloque no las alcanza.
#
#  Se usa `mod_expires`, que ya viene CARGADO en la imagen `wordpress:apache`
#  (`mod_headers` está disponible pero no activo, y habilitarlo sería otro
#  cambio de superficie).
#
#  ── Fingerprinting ─────────────────────────────────────────────────────────
#  Apache anunciaba `Server: Apache/2.4.x (Debian)` y las firmas de error. En
#  producción Caddy borra esas cabeceras de la cara pública, pero el panel y el
#  BFF llegan a Apache por la red interna: no hay razón para dar la versión.
#  `ServerTokens Prod` deja solo `Server: Apache`; `ServerSignature Off` quita la
#  firma de las páginas de error. `expose_php = Off` vive en `uploads.ini`.
# ============================================================================

<IfModule mod_expires.c>
    <Directory "/var/www/html/wp-content/uploads">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </Directory>
</IfModule>

ServerTokens Prod
ServerSignature Off
