; Límites de subida ampliados para WordPress (medios, importaciones, etc.)
;
; ── memory_limit y el presupuesto del contenedor ────────────────────────────
; El contenedor de WordPress tiene 512 MB (`docker-compose.prod.yml`,
; deploy.resources.limits.memory). Este valor es un TECHO POR PETICIÓN, así que
; tiene que dejar sitio a los demás workers de Apache (6, ver apache-mpm.conf),
; al segmento compartido de OPcache (opcache.ini) y al proceso padre. Con 512M
; —el límite entero del contenedor— una sola petición pesada de WPGraphQL podía
; consumir el cgroup y provocar `OOMKilled`: el sitio devolvía 500 hasta que
; Docker lo reiniciaba.
;
; El presupuesto documentado (y comprobado por tests/unit/apache-mpm.test.ts) es:
;   base (padre + OPcache compartido) ≈ 114 MB  +  6 workers × 60 MB ≈ 474 MB
; Un pico puntual que necesite más memoria se sube POR COMANDO
; (`wp --memory-limit=512M <comando>`), no para todo el sitio.
file_uploads = On
memory_limit = 128M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 600
max_input_time = 600
max_input_vars = 3000
