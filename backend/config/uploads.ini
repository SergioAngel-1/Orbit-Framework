; Límites de subida ampliados para WordPress (medios, importaciones, etc.)
;
; ── memory_limit y el presupuesto del contenedor ────────────────────────────
; El contenedor de WordPress tiene 768 MB (`docker-compose.prod.yml`,
; deploy.resources.limits.memory). Este valor es un TECHO POR PETICIÓN, así que
; tiene que dejar sitio a los demás workers de Apache (5, ver apache-mpm.conf),
; al segmento compartido de OPcache (opcache.ini) y al proceso padre. Con 512M
; —el límite entero del contenedor— una sola petición pesada de WPGraphQL podía
; consumir el cgroup y provocar `OOMKilled`: el sitio devolvía 500 hasta que
; Docker lo reiniciaba.
;
; El presupuesto documentado (y comprobado por tests/unit/apache-mpm.test.ts) es:
;   base (padre + OPcache compartido) ≈ 114 MB  +  5 workers × 60 MB ≈ 414 MB
;   peor caso: una petición al tope (256M) + 4 workers normales ≈ 610 MB
; 256M es lo que recomienda WooCommerce: con menos, una consulta grande de
; WPGraphQL o una exportación desde el panel fallan con 500 por memoria agotada.
; Un pico puntual que necesite más memoria se sube POR COMANDO
; (`wp --memory-limit=512M <comando>`), no para todo el sitio.
file_uploads = On
memory_limit = 256M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 600
max_input_time = 600
max_input_vars = 3000

; No anunciar la versión de PHP en cada respuesta (`X-Powered-By`). Caddy también
; la borra en producción, pero el panel y el BFF hablan con Apache por la red
; interna: no hay razón para emitirla.
expose_php = Off
