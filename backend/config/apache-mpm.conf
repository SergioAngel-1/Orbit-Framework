# ============================================================================
#  apache-mpm.conf — Techo de procesos de Apache (MPM prefork) en PRODUCCIÓN
#
#  Se monta en `/etc/apache2/conf-enabled/`, que Apache lee DESPUÉS de
#  `mods-enabled/mpm_prefork.conf`: estas directivas ganan sin tocar el archivo de
#  la distribución, y se ve de un vistazo qué es nuestro y qué viene en la imagen.
#  Solo en docker-compose.prod.yml: en desarrollo no hay presión de memoria que
#  justifique estrechar nada.
#
#  ── Por qué existe ─────────────────────────────────────────────────────────
#  La imagen oficial de WordPress trae MaxRequestWorkers 150 y
#  MaxConnectionsPerChild 0 (los hijos no se reciclan nunca), y cada hijo puede
#  crecer hasta el `memory_limit` de PHP (backend/config/uploads.ini). Con el
#  límite de memoria del contenedor (docker-compose.prod.yml, `deploy.resources`)
#  basta una ráfaga de consultas WPGraphQL pesadas —o el prerender de `next build`—
#  para que Apache haga fork hasta que el cgroup lo mata: `OOMKilled`, un 500 en
#  /graphql, luego 408 y Apache colgado. El peligro no son los hijos ociosos, es
#  el TECHO.
#
#  ── Cómo dimensionarlo ─────────────────────────────────────────────────────
#  Medido en un servidor real con carga de WPGraphQL: cada hijo cuesta ~60 MB al
#  cgroup (los ~104 MB de OPcache son un segmento COMPARTIDO que `ps` cuenta una
#  vez por hijo, pero el cgroup solo una), y el proceso padre supone ~10 MB:
#
#      presupuesto = 10 MB (padre) + OPcache compartido + workers × 60 MB
#
#  El tamaño del segmento compartido sale de `backend/config/opcache.ini`
#  (memory_consumption + interned_strings_buffer + jit_buffer_size). Con los
#  valores de la plantilla (96 + 8 + 0 = 104 MB) y 768 MB de contenedor:
#
#      típico:     10 + 104 + 5 × 60       = 414 MB   →  354 MB de margen
#      peor caso:  10 + 104 + 256 + 4 × 60 = 610 MB   →  158 MB de margen
#
#  El peor caso es una petición que llega al tope de `memory_limit` (256M)
#  mientras los otros 4 workers trabajan con carga normal: también tiene que
#  caber, o esa petición se lleva el contenedor entero por OOM.
#
#  Si subes el límite del contenedor o el de OPcache, recalcula este número en la
#  misma proporción (a 2 GB caben ~30, aunque con pocas CPU más de una docena de
#  workers PHP no añade rendimiento: solo formas de quedarse sin memoria).
#  `frontend/tests/unit/apache-mpm.test.ts` lee ESTE archivo, `opcache.ini`,
#  `uploads.ini` y el límite del compose, y falla si el presupuesto no cabe.
#
#  `memory_limit` (uploads.ini) es el techo de UNA petición, no el consumo típico:
#  está en 256M (lo que WooCommerce recomienda) y no en el límite del contenedor,
#  para que un worker desbocado no se lleve el cgroup por delante. Por eso hay 5
#  workers y no 6, y el contenedor tiene 768 MB: así cabe también el peor caso.
#
#  MaxConnectionsPerChild deja de ser 0 (reciclar nunca) y pasa a 500: acota lo que
#  un hijo puede acumular por fragmentación o fugas de una extensión, a cambio de un
#  fork cada 500 peticiones, que es ruido.
# ============================================================================

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        5
    MaxConnectionsPerChild   500
</IfModule>
