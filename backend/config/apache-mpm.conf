# ============================================================================
#  apache-mpm.conf — Techo de procesos de Apache (MPM prefork) en PRODUCCIÓN
#
#  Se monta en `/etc/apache2/conf-enabled/`, que Apache lee DESPUÉS de
#  `mods-enabled/mpm_prefork.conf`: estas directivas ganan sin tocar el archivo de
#  la distribución, y se ve de un vistazo qué es nuestro y qué viene en la imagen.
#  Solo en docker-compose.prod.yml: en desarrollo no hay presión de memoria que
#  justifique estrechar nada.
#
#  ── Por qué existe ─────────────────────────────────────────────────────────
#  La imagen oficial de WordPress trae MaxRequestWorkers 150 y
#  MaxConnectionsPerChild 0 (los hijos no se reciclan nunca), y cada hijo puede
#  crecer hasta el `memory_limit` de PHP (backend/config/uploads.ini). Con el
#  límite de memoria del contenedor (docker-compose.prod.yml, `deploy.resources`)
#  basta una ráfaga de consultas WPGraphQL pesadas —o el prerender de `next build`—
#  para que Apache haga fork hasta que el cgroup lo mata: `OOMKilled`, un 500 en
#  /graphql, luego 408 y Apache colgado. El peligro no son los hijos ociosos, es
#  el TECHO.
#
#  ── Cómo dimensionarlo ─────────────────────────────────────────────────────
#  Medido en un servidor real con carga de WPGraphQL: cada hijo cuesta ~60 MB al
#  cgroup (los ~90 MB de OPcache son un segmento COMPARTIDO que `ps` cuenta una
#  vez por hijo, pero el cgroup solo una), y el proceso padre más OPcache
#  suponen ~100 MB de base:
#
#      MaxRequestWorkers  ≈  (límite de memoria del contenedor − 100 MB) / 60 MB
#
#  Con los 512 MB de la plantilla: (512 − 100) / 60 ≈ 6. Si subes el límite del
#  contenedor, sube también este número en la misma proporción (a 2 GB caben ~30,
#  aunque con pocas CPU más de una docena de workers PHP no añade rendimiento:
#  solo formas de quedarse sin memoria). tests/unit/apache-mpm.test.ts comprueba
#  que el techo cabe en el límite configurado.
#
#  MaxConnectionsPerChild deja de ser 0 (reciclar nunca) y pasa a 500: acota lo que
#  un hijo puede acumular por fragmentación o fugas de una extensión, a cambio de un
#  fork cada 500 peticiones, que es ruido.
# ============================================================================

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        6
    MaxConnectionsPerChild   500
</IfModule>
