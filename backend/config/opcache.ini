; ============================================================================
;  opcache.ini — Ajustes de OPcache para PRODUCCIÓN (PHP 8.4)
;
;  Se monta SOLO en docker-compose.prod.yml (en dev se deja el OPcache por
;  defecto, que revalida timestamps para recoger cambios de código en caliente).
;
;  ⚠ validate_timestamps=0: PHP NO comprueba mtime de los archivos, así que
;  cualquier cambio en mu-plugins/plugins/tema requiere REINICIAR el contenedor
;  de WordPress (o ejecutar `opcache_reset()`). Es el ajuste correcto para un
;  despliegue inmutable de producción: máximo rendimiento, cero stat() por hit.
; ============================================================================

; ── Presupuesto de memoria (leer antes de subir estos números) ──────────────
; El segmento de OPcache es COMPARTIDO entre los workers de Apache, pero cuenta
; ENTERO en el cgroup del contenedor (512 MB, ver docker-compose.prod.yml). Con
; 256 MB de caché + 16 MB de interned + 64 MB de JIT reservaba 336 MB, y el
; dimensionado de Apache (apache-mpm.conf) solo dejaba ~90 MB para OPcache: bajo
; carga el contenedor se pasaba del límite y moría por `OOMKilled`.
;
; Ahora OPcache reserva 96 + 8 + 0 = 104 MB, que junto al padre (~10 MB) y los
; 6 workers × 60 MB deja ~38 MB de margen sobre los 512 MB. Si subes estos
; valores, sube a la vez `memory` del servicio Y recalcula MaxRequestWorkers;
; tests/unit/apache-mpm.test.ts falla si el presupuesto no cabe.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; JIT (PHP 8.4) APAGADO: WordPress es I/O-bound (MySQL, Redis, red), no pasa
; horas en bucles de CPU, así que el JIT casi no aporta y sus 64 MB de búfer
; son memoria que le falta a los workers. Si una instancia tiene código propio
; intensivo en CPU, actívalo aquí y vuelve a hacer el presupuesto.
opcache.jit=off
opcache.jit_buffer_size=0

; Caché de rutas reales (menos syscalls en cada include).
realpath_cache_size=4096K
realpath_cache_ttl=600
